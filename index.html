  <style>
    /* ===== БАЗА ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b0b1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .app { max-width: 1400px; margin: 0 auto; padding: 20px 16px; width: 100%; flex: 1; display: flex; flex-direction: column; }
    .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 24px; }

    /* ===== ЛОГОТИП ===== */
    .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; cursor: pointer; }
    .logo svg { width: 50px; height: 50px; }
    .logo-text { font-size: 32px; font-weight: 900; background: linear-gradient(135deg, #2ecc71, #1abc9c, #0b0b1a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; }

    .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 10px 22px; border: none; border-radius: 40px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.06); color: #fff; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1); }
    .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); border: none; color: #fff; box-shadow: 0 8px 20px rgba(102,126,234,0.3); }
    .btn-primary:hover { transform: scale(1.03); }
    .btn-success { background: #2ecc71; color: #0b0b1a; border: none; }
    .btn-success:hover { background: #27ae60; }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); }
    .btn-outline:hover { background: rgba(255,255,255,0.1); }
    .btn-pro { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; border: none; }
    .btn-pro:hover { transform: scale(1.05); }

    /* ===== ОСТАЛЬНЫЕ СТИЛИ (сокращены для читаемости, но они те же) ===== */
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; flex: 1; }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
    .editor-panel { background: rgba(255,255,255,0.04); border-radius: 24px; padding: 20px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 18px; }
    .panel-title { font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.7); }
    .block-toolbar { display: flex; flex-wrap: wrap; gap: 10px; padding: 8px 0; }
    .block-toolbar .btn { flex: 1 0 auto; font-size: 13px; padding: 8px 16px; background: rgba(255,255,255,0.08); border-radius: 30px; text-align: center; }
    .block-toolbar .btn:hover { background: rgba(255,255,255,0.18); }
    .blocks-list { display: flex; flex-direction: column; gap: 12px; max-height: 550px; overflow-y: auto; padding-right: 4px; }
    .blocks-list::-webkit-scrollbar { width: 4px; }
    .blocks-list::-webkit-scrollbar-thumb { background: #667eea; border-radius: 8px; }
    .block-item { background: rgba(255,255,255,0.06); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid #667eea; cursor: grab; transition: background 0.15s; }
    .block-item.dragging { opacity: 0.5; background: rgba(255,255,255,0.02); }
    .block-item.drag-over { border-left-color: #f093fb; background: rgba(255,255,255,0.1); }
    .block-item:hover { background: rgba(255,255,255,0.09); }
    .block-item .block-header { display: flex; justify-content: space-between; align-items: center; }
    .block-item .block-type { font-size: 12px; text-transform: uppercase; color: rgba(255,255,255,0.4); letter-spacing: 1px; }
    .block-item .block-actions { display: flex; gap: 6px; }
    .block-item .block-actions button { background: transparent; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 18px; padding: 0 4px; }
    .block-item .block-actions button:hover { color: #fff; }
    .block-item .block-actions .del:hover { color: #e74c3c; }
    .block-item input, .block-item textarea { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 14px; color: #fff; font-size: 15px; outline: none; font-family: inherit; }
    .block-item input:focus, .block-item textarea:focus { border-color: #667eea; }
    .block-item textarea { min-height: 60px; resize: vertical; }
    .block-item .btn-url-row { display: flex; gap: 8px; }
    .block-item .btn-url-row input { flex: 1; }
    .block-item .upload-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .block-item .upload-row input[type="file"] { display: none; }
    .block-item .upload-row .upload-btn { background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 30px; cursor: pointer; font-size: 13px; transition: 0.2s; border: 1px solid rgba(255,255,255,0.2); }
    .block-item .upload-row .upload-btn:hover { background: rgba(255,255,255,0.2); }
    .preview-panel { background: rgba(255,255,255,0.04); border-radius: 24px; padding: 20px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 16px; }
    .preview-panel .preview-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .preview-panel .preview-url { font-size: 14px; color: rgba(255,255,255,0.5); background: rgba(0,0,0,0.3); padding: 6px 16px; border-radius: 30px; }
    .preview-frame { background: #1a1a2e; border-radius: 16px; padding: 20px; min-height: 400px; overflow: auto; border: 1px solid rgba(255,255,255,0.05); position: relative; }
    .preview-frame .site-preview { position: relative; width: 100%; height: 100%; min-height: 400px; }
    .preview-item { position: absolute; cursor: move; border: 2px solid transparent; padding: 4px; overflow: hidden; user-select: none; }
    .preview-item:hover { border-color: rgba(255,255,255,0.15); }
    .preview-item.selected { border-color: #667eea; }
    .preview-item .resize-handle { position: absolute; width: 12px; height: 12px; background: #667eea; border-radius: 2px; display: none; z-index: 10; }
    .preview-item.selected .resize-handle { display: block; }
    .preview-item .resize-handle.tl { top: -6px; left: -6px; cursor: nwse-resize; }
    .preview-item .resize-handle.tr { top: -6px; right: -6px; cursor: nesw-resize; }
    .preview-item .resize-handle.bl { bottom: -6px; left: -6px; cursor: nesw-resize; }
    .preview-item .resize-handle.br { bottom: -6px; right: -6px; cursor: nwse-resize; }
    .preview-item .resize-handle.tc { top: -6px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
    .preview-item .resize-handle.bc { bottom: -6px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
    .preview-item .resize-handle.ml { top: 50%; left: -6px; transform: translateY(-50%); cursor: ew-resize; }
    .preview-item .resize-handle.mr { top: 50%; right: -6px; transform: translateY(-50%); cursor: ew-resize; }
    .preview-item img { max-width: 100%; height: auto; display: block; }
    .preview-item .btn-preview { display: inline-block; padding: 8px 24px; background: #667eea; border-radius: 40px; color: #fff; border: none; font-weight: 600; cursor: default; text-decoration: none; }
    .empty-preview { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px; color: rgba(255,255,255,0.25); font-size: 18px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; text-align: center; }
    .footer { margin-top: 30px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; font-size: 14px; color: rgba(255,255,255,0.25); }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { max-width: 700px; width: 100%; background: #1a1a2e; border-radius: 24px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { margin-top: 0; font-size: 26px; background: linear-gradient(135deg, #f093fb, #f5576c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .modal-content .field { margin: 16px 0; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 12px 16px; border-radius: 12px; flex-wrap: wrap; gap: 8px; }
    .modal-content .field label { color: rgba(255,255,255,0.5); font-weight: 500; }
    .modal-content .field .value { color: #fff; font-weight: 600; word-break: break-all; }
    .modal-content input, .modal-content select { width: 100%; padding: 12px; border-radius: 12px; background: #0b0b1a; border: 1px solid #333; color: #fff; margin: 8px 0; }
    .modal-content .btn-close-modal { background: transparent; border: none; color: rgba(255,255,255,0.4); font-size: 14px; cursor: pointer; margin-top: 20px; text-decoration: underline; }
    .modal-content .btn-close-modal:hover { color: #fff; }
    .plan-badge { display: inline-block; padding: 4px 14px; border-radius: 30px; font-size: 14px; font-weight: 600; }
    .plan-free { background: #e74c3c; color: #fff; }
    .plan-pro { background: #2ecc71; color: #0b0b1a; }
    .export-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); display: none; justify-content: center; align-items: center; z-index: 9998; padding: 20px; }
    .export-overlay.active { display: flex; }
    .export-content { max-width: 700px; background: rgba(255,255,255,0.08); border-radius: 32px; padding: 40px 36px; border: 1px solid rgba(255,255,255,0.12); text-align: center; width: 100%; }
    .export-content h2 { font-size: 32px; margin-top: 0; background: linear-gradient(135deg, #f093fb, #f5576c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .export-content .big-icon { font-size: 64px; display: block; margin-bottom: 10px; }
    .export-content .info-text { background: rgba(0,0,0,0.3); padding: 16px; border-radius: 16px; margin: 16px 0; color: #ccc; line-height: 1.6; }
    .export-content .btn-download { display: inline-block; padding: 16px 50px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 24px; font-weight: 700; border: none; border-radius: 60px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .export-content .btn-download:hover { transform: scale(1.05); }
    .export-content .btn-close-export { background: transparent; border: none; color: rgba(255,255,255,0.4); font-size: 16px; margin-top: 20px; cursor: pointer; text-decoration: underline; }
    .export-content .btn-close-export:hover { color: #fff; }
    .admin-users-list { max-height: 300px; overflow-y: auto; margin: 10px 0; }
    .admin-user-item { display: flex; justify-content: space-between; padding: 8px 12px; background: rgba(255,255,255,0.04); border-radius: 10px; margin: 4px 0; align-items: center; flex-wrap: wrap; gap: 6px; }
    .admin-user-item .uid { font-size: 12px; color: rgba(255,255,255,0.4); }

    // ===== РАБОТА С БЛОКАМИ =====
    function addBlock(type) {
      const newBlock = { type, data: '', x: 20 + Math.random() * 100, y: 20 + Math.random() * 100, width: type === 'image' ? 200 : 250, height: type === 'image' ? 150 : 60 };
      if (type === 'button') newBlock.url = '';
      blocks.push(newBlock);
      renderBlocksList();
      renderPreview();
      autoSave();
    }
    function deleteBlock(idx) { blocks.splice(idx, 1); renderBlocksList(); renderPreview(); autoSave(); }
    function moveBlock(idx, dir) {
      const ni = idx + dir;
      if (ni < 0 || ni >= blocks.length) return;
      [blocks[idx], blocks[ni]] = [blocks[ni], blocks[idx]];
      renderBlocksList();
      renderPreview();
      autoSave();
    }
    function clearBlocks() {
      if (!blocks.length) return;
      if (confirm('Удалить все блоки?')) { blocks = []; renderBlocksList(); renderPreview(); autoSave(); }
    }
    function autoSave() { localStorage.setItem(STORAGE_KEY, JSON.stringify(blocks)); }
    function loadFromStorage() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { try { const p = JSON.parse(saved); if (Array.isArray(p)) blocks = p; } catch(e) {} }
      const bg = getBgSettings();
      bgColor.value = bg.color || '#1a1a2e';
      bgImage.value = bg.image || '';
      renderBlocksList();
      renderPreview();
    }
    function resetProject() {
      if (!confirm('Сбросить проект?')) return;
      localStorage.removeItem(STORAGE_KEY);
      blocks = [];
      renderBlocksList();
      renderPreview();
      autoSave();
    }

    // ===== РЕНДЕРИНГ СПИСКА =====
    let dragIndex = null;
    function renderBlocksList() {
      blocksList.innerHTML = '';
      blocks.forEach((block, index) => {
        const div = document.createElement('div');
        div.className = 'block-item';
        div.draggable = true;
        div.dataset.index = index;
        div.addEventListener('dragstart', (e) => { dragIndex = index; div.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', index); });
        div.addEventListener('dragend', () => { div.classList.remove('dragging'); document.querySelectorAll('.block-item').forEach(el => el.classList.remove('drag-over')); });
        div.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; document.querySelectorAll('.block-item').forEach(el => el.classList.remove('drag-over')); div.classList.add('drag-over'); });
        div.addEventListener('dragleave', () => { div.classList.remove('drag-over'); });
        div.addEventListener('drop', (e) => {
          e.preventDefault();
          div.classList.remove('drag-over');
          const from = parseInt(e.dataTransfer.getData('text/plain'));
          if (from !== index && from >= 0 && from < blocks.length) {
            const [removed] = blocks.splice(from, 1);
            blocks.splice(index, 0, removed);
            renderBlocksList();
            renderPreview();
            autoSave();
          }
        });

        const header = document.createElement('div');
        header.className = 'block-header';
        const typeLabel = document.createElement('span');
        typeLabel.className = 'block-type';
        const names = { header:'Заголовок', text:'Текст', image:'Картинка', button:'Кнопка' };
        typeLabel.textContent = names[block.type] || block.type;
        const actions = document.createElement('div');
        actions.className = 'block-actions';
        const up = document.createElement('button'); up.textContent = '↑'; up.onclick = (e) => { e.stopPropagation(); moveBlock(index, -1); };
        const down = document.createElement('button'); down.textContent = '↓'; down.onclick = (e) => { e.stopPropagation(); moveBlock(index, 1); };
        const del = document.createElement('button'); del.textContent = '✕'; del.className = 'del'; del.onclick = (e) => { e.stopPropagation(); deleteBlock(index); };
        actions.append(up, down, del);
        header.append(typeLabel, actions);
        div.appendChild(header);

        if (block.type === 'text') {
          const ta = document.createElement('textarea');
          ta.placeholder = 'Введите текст...';
          ta.value = block.data || '';
          ta.oninput = () => { block.data = ta.value; renderPreview(); autoSave(); };
          div.appendChild(ta);
        } else if (block.type === 'button') {
          const row = document.createElement('div');
          row.className = 'btn-url-row';
          const inpText = document.createElement('input');
          inpText.placeholder = 'Текст кнопки';
          inpText.value = block.data || '';
          inpText.oninput = () => { block.data = inpText.value; renderPreview(); autoSave(); };
          const inpUrl = document.createElement('input');
          inpUrl.placeholder = 'URL (например, https://...)';
          inpUrl.value = block.url || '';
          inpUrl.oninput = () => { block.url = inpUrl.value; renderPreview(); autoSave(); };
          row.append(inpText, inpUrl);
          div.appendChild(row);
        } else if (block.type === 'image') {
          const inp = document.createElement('input');
          inp.placeholder = 'URL картинки...';
          inp.value = block.data || '';
          inp.oninput = () => { block.data = inp.value; renderPreview(); autoSave(); };
          div.appendChild(inp);
          const uploadRow = document.createElement('div');
          uploadRow.className = 'upload-row';
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = 'image/*';
          const label = document.createElement('label');
          label.className = 'upload-btn';
          label.textContent = '📂 Загрузить с устройства';
          label.onclick = () => fileInput.click();
          fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              block.data = ev.target.result;
              renderPreview();
              autoSave();
              renderBlocksList();
            };
            reader.readAsDataURL(file);
          };
          uploadRow.append(fileInput, label);
          div.appendChild(uploadRow);
        } else {
          const inp = document.createElement('input');
          inp.placeholder = 'Введите заголовок...';
          inp.value = block.data || '';
          inp.oninput = () => { block.data = inp.value; renderPreview(); autoSave(); };
          div.appendChild(inp);
        }
        blocksList.appendChild(div);
      });
    }

    // ===== РЕНДЕРИНГ ПРЕВЬЮ =====
    let selectedIndex = null;
    function renderPreview() {
      const container = previewFrame;
      let html = '';
      if (blocks.length === 0) {
        html = '<div class="empty-preview">Добавьте блоки</div>';
      } else {
        blocks.forEach((block, index) => {
          const d = block.data || '';
          let content = '';
          if (block.type === 'header') content = '<h2>' + escapeHtml(d) + '</h2>';
          else if (block.type === 'text') content = '<p>' + escapeHtml(d).replace(/\n/g, '<br>') + '</p>';
          else if (block.type === 'image') content = d ? '<img src="' + escapeHtml(d) + '" alt="image">' : '<p style="color:gray;">[картинка]</p>';
          else if (block.type === 'button') {
            const url = block.url || '#';
            content = '<a href="' + escapeHtml(url) + '" class="btn-preview" target="_blank">' + (escapeHtml(d) || 'Кнопка') + '</a>';
          }
          else content = '<div>' + escapeHtml(d) + '</div>';

          const x = block.x || 20;
          const y = block.y || 20;
          const w = block.width || 200;
          const h = block.height || 60;
          const selectedClass = (selectedIndex === index) ? ' selected' : '';
          html += `<div class="preview-item${selectedClass}" data-index="${index}" style="left:${x}px; top:${y}px; width:${w}px; height:${h}px; overflow:hidden;">
            ${content}
            <div class="resize-handle tl"></div><div class="resize-handle tr"></div>
            <div class="resize-handle bl"></div><div class="resize-handle br"></div>
            <div class="resize-handle tc"></div><div class="resize-handle bc"></div>
            <div class="resize-handle ml"></div><div class="resize-handle mr"></div>
          </div>`;
        });
      }
      container.innerHTML = html;

      const items = container.querySelectorAll('.preview-item');
      items.forEach(item => {
        const idx = parseInt(item.dataset.index);
        item.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('resize-handle')) return;
          selectedIndex = idx;
          renderPreview();
          startDrag(e, idx);
        });
        const handles = item.querySelectorAll('.resize-handle');
        handles.forEach(handle => {
          handle.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            e.preventDefault();
            const dir = handle.className.split(' ')[1];
            startResize(e, idx, dir);
          });
        });
      });

      const bg = getBgSettings();
      container.style.background = bg.color || '#1a1a2e';
      container.style.backgroundImage = bg.image ? 'url(' + bg.image + ')' : 'none';
      container.style.backgroundSize = 'cover';
      container.style.backgroundPosition = 'center';
    }

    function startDrag(e, idx) {
      if (e.button !== 0) return;
      const item = e.currentTarget;
      const rect = item.getBoundingClientRect();
      const offsetX = e.clientX - rect.left;
      const offsetY = e.clientY - rect.top;
      function onMove(ev) {
        const container = document.getElementById('previewFrame');
        const containerRect = container.getBoundingClientRect();
        let newX = ev.clientX - containerRect.left - offsetX;
        let newY = ev.clientY - containerRect.top - offsetY;
        newX = Math.max(0, newX);
        newY = Math.max(0, newY);
        const maxW = containerRect.width - (blocks[idx].width || 100);
        const maxH = containerRect.height - (blocks[idx].height || 60);
        newX = Math.min(newX, maxW);
        newY = Math.min(newY, maxH);
        blocks[idx].x = newX;
        blocks[idx].y = newY;
        renderPreview();
        autoSave();
      }
      function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }

    function startResize(e, idx, dir) {
      e.preventDefault();
      const item = e.currentTarget.parentElement;
      const rect = item.getBoundingClientRect();
      const containerRect = document.getElementById('previewFrame').getBoundingClientRect();
      const startX = e.clientX;
      const startY = e.clientY;
      const startW = rect.width;
      const startH = rect.height;
      const startL = rect.left - containerRect.left;
      const startT = rect.top - containerRect.top;

      function onMove(ev) {
        let dx = ev.clientX - startX;
        let dy = ev.clientY - startY;
        let newX = startL, newY = startT, newW = startW, newH = startH;
        if (dir.includes('r')) { newW = Math.max(50, startW + dx); }
        if (dir.includes('l')) { newX = startL + dx; newW = Math.max(50, startW - dx); }
        if (dir.includes('b')) { newH = Math.max(30, startH + dy); }
        if (dir.includes('t')) { newY = startT + dy; newH = Math.max(30, startH - dy); }
        if (dir === 'tc') { newY = startT + dy; newH = Math.max(30, startH - dy); }
        if (dir === 'bc') { newH = Math.max(30, startH + dy); }
        if (dir === 'ml') { newX = startL + dx; newW = Math.max(50, startW - dx); }
        if (dir === 'mr') { newW = Math.max(50, startW + dx); }
        const maxW = containerRect.width - newX;
        const maxH = containerRect.height - newY;
        newW = Math.min(newW, maxW);
        newH = Math.min(newH, maxH);
        newX = Math.max(0, newX);
        newY = Math.max(0, newY);
        blocks[idx].x = newX;
        blocks[idx].y = newY;
        blocks[idx].width = newW;
        blocks[idx].height = newH;
        renderPreview();
        autoSave();
      }
      function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }

    // ===== ЭКСПОРТ =====
    function generateSiteHTML() {
      if (blocks.length === 0) { alert('Добавьте блоки'); return null; }
      let content = '';
      blocks.forEach(b => {
        const d = escapeHtml(b.data || '');
        let inner = '';
        if (b.type === 'header') inner = '<h2>' + d + '</h2>';
        else if (b.type === 'text') inner = '<p>' + d.replace(/\n/g, '<br>') + '</p>';
        else if (b.type === 'image') inner = d ? '<img src="' + d + '" style="max-width:100%;">' : '';
        else if (b.type === 'button') {
          const url = b.url ? escapeHtml(b.url) : '#';
          inner = '<a href="' + url + '" style="display:inline-block;padding:10px 30px;background:#667eea;border-radius:40px;color:#fff;text-decoration:none;font-weight:600;">' + (d || 'Кнопка') + '</a>';
        }
        else inner = '<div>' + d + '</div>';
        const x = b.x || 20;
        const y = b.y || 20;
        const w = b.width || 200;
        const h = b.height || 60;
        content += `<div style="position:absolute; left:${x}px; top:${y}px; width:${w}px; height:${h}px; overflow:hidden;">${inner}</div>`;
      });

      let footer = '';
      if (userPlan === 'free') {
        footer = `<div class="footer">Создано в <a href="${BASE_URL}" target="_blank" style="color:#f093fb;text-decoration:none;">DinoSiteX</a></div>`;
      }
      const bg = getBgSettings();
      let bgStyle = '';
      if (bg.image) bgStyle = `background-image: url('${bg.image}'); background-size: cover; background-position: center;`;
      else if (bg.color) bgStyle = `background-color: ${bg.color};`;

      return `<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Мой сайт</title><style>body{font-family:'Segoe UI',sans-serif;margin:0;padding:0;min-height:100vh;color:#eee;line-height:1.6;${bgStyle}position:relative;overflow:hidden;}h2{color:#f093fb;margin:0 0 6px 0;}p{margin:0 0 8px 0;}img{max-width:100%;border-radius:12px;}a{color:#667eea;}.footer{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:14px;color:#888;border-top:1px solid #222;padding-top:20px;}</style></head><body>${content}${footer}</body></html>`;
    }

    function showExportOverlay() {
      if (blocks.length === 0) { alert('Добавьте блоки'); return; }
      watermarkInfo.textContent = userPlan === 'free' ? '⚠️ Бесплатный план — водяной знак' : '✅ PRO — без водяного знака';
      exportOverlay.classList.add('active');
    }
    function downloadSite() {
      const html = generateSiteHTML();
      if (!html) return;
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'сайт.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      exportOverlay.classList.remove('active');
    }

    // ===== FIRESTORE / AUTH =====
    async function loadUserPlan(uid) {
      try {
        const doc = await db.collection('users').doc(uid).get();
        if (doc.exists) {
          const data = doc.data();
          userPlan = data.plan || 'free';
          userExpiry = data.proExpiry ? data.proExpiry.toDate() : null;
          if (userPlan === 'pro' && userExpiry && userExpiry < new Date()) {
            userPlan = 'free';
            userExpiry = null;
            await db.collection('users').doc(uid).update({ plan: 'free', proExpiry: null });
          }
        } else {
          await db.collection('users').doc(uid).set({ plan: 'free', proExpiry: null });
          userPlan = 'free';
          userExpiry = null;
        }
        if (uid === ADMIN_UID) {
          userPlan = 'pro';
          userExpiry = null;
          await db.collection('users').doc(uid).set({ plan: 'pro', proExpiry: null }, { merge: true });
        }
      } catch(e) { console.error(e); userPlan = 'free'; userExpiry = null; }
    }

      if (user) {
        authBtn.textContent = user.email || 'Аккаунт';
        authBtn.style.borderColor = '#2ecc71';
        profileBtn.style.display = 'inline-block';
        adminBtn.style.display = (user.uid === ADMIN_UID) ? 'inline-block' : 'none';
      } else {
        authBtn.textContent = 'Войти';
        authBtn.style.borderColor = 'rgba(255,255,255,0.3)';
        profileBtn.style.display = 'none';
        adminBtn.style.display = 'none';
      }
    }

    async function updateProfileUI() {
      if (currentUser) {
        profileUid.textContent = currentUser.uid;
        profilePlan.innerHTML = userPlan === 'pro' ? '<span class="plan-badge plan-pro">PRO</span>' : '<span class="plan-badge plan-free">Free</span>';
        profileExpiry.textContent = userExpiry ? userExpiry.toLocaleDateString() + ' ' + userExpiry.toLocaleTimeString() : (userPlan === 'pro' ? 'Навсегда' : '—');

    async function authLogin() {
      const email = authEmail.value.trim(), pass = authPassword.value.trim();
      if (!email || !pass) return alert('Заполните поля');
      try { await auth.signInWithEmailAndPassword(email, pass); authModal.classList.remove('active'); await checkGiftAfterLogin(); }
      catch(e) { alert('Ошибка входа: ' + e.message); }
    }
    async function authRegister() {
      const email = authEmail.value.trim(), pass = authPassword.value.trim();
      if (!email || !pass) return alert('Заполните поля');
      if (pass.length < 6) return alert('Пароль минимум 6 символов');
      try { await auth.createUserWithEmailAndPassword(email, pass); authModal.classList.remove('active'); await checkGiftAfterLogin(); }
      catch(e) { alert('Ошибка регистрации: ' + e.message); }
    }

    // ===== ПОДАРОЧНЫЕ ССЫЛКИ =====
    function generateToken() { return Math.random().toString(36).substring(2,10) + Math.random().toString(36).substring(2,10); }
    async function createGiftLink() {
      const days = parseInt(giftDays.value);
      if (isNaN(days) || days < 1 || days > 360) return alert('Введите корректное количество дней (1-360)');
      if (!currentUser || currentUser.uid !== ADMIN_UID) return alert('Только для админа');
      const token = generateToken();
      const expiry = new Date(Date.now() + days * 86400000);
      try {
        await db.collection('gifts').doc(token).set({ days, expiry, used: false, createdAt: new Date() });
        const link = `${BASE_URL}?gift=${token}`;
        giftResult.innerHTML = `✅ Ссылка создана: <a href="${link}" target="_blank" style="color:#f093fb;">${link}</a> (скопируйте и отправьте)`;
        loadGiftList();
      } catch(e) { giftResult.textContent = '❌ Ошибка: ' + e.message; }
    }
    async function checkGiftAfterLogin() {
      const token = localStorage.getItem('gift_token');
      if (!token || !currentUser) return;
      try {
        const doc = await db.collection('gifts').doc(token).get();
        if (!doc.exists || doc.data().used || doc.data().expiry.toDate() < new Date()) {
          localStorage.removeItem('gift_token');
          return;
        }
        const newExpiry = new Date(Date.now() + doc.data().days * 86400000);
        await db.collection('users').doc(currentUser.uid).set({ plan: 'pro', proExpiry: newExpiry }, { merge: true });
        await db.collection('gifts').doc(token).update({ used: true });
        localStorage.removeItem('gift_token');
        await loadUserPlan(currentUser.uid);
        await updateProfileUI();
        alert('🎉 Поздравляем! Вы получили PRO-план на ' + doc.data().days + ' дней!');
      } catch(e) { console.error('Ошибка активации подарка:', e); }
    }
    async function loadGiftList() {
      if (!currentUser || currentUser.uid !== ADMIN_UID) { giftList.innerHTML = 'Нет доступа'; return; }
      try {
        const snapshot = await db.collection('gifts').orderBy('createdAt', 'desc').get();
        let html = '';
        snapshot.forEach(doc => {
          const data = doc.data();
          const token = doc.id;
          const days = data.days || '?';
          const used = data.used || false;
          const statusClass = used ? 'used' : 'active';
          const statusText = used ? '❌ Использована' : '✅ Активна';
          const expiry = data.expiry ? data.expiry.toDate().toLocaleDateString() : '—';
          html += `<div class="gift-link-item">
            <span class="token">${escapeHtml(token)}</span>
            <span class="days">${days} дн.</span>
            <span class="status ${statusClass}">${statusText}</span>
            <span style="font-size:12px;color:rgba(255,255,255,0.4);">до ${expiry}</span>
          </div>`;
        });
        giftList.innerHTML = html || 'Нет ссылок';
      } catch(e) { giftList.innerHTML = 'Ошибка загрузки: ' + e.message; }
    }

      const days = parseInt(grantDays.value);

    closeProfileBtn.addEventListener('click', () => profileModal.classList.remove('active'));
    profileModal.addEventListener('click', e => { if (e.target === profileModal) profileModal.classList.remove('active'); });
    logoutBtn.addEventListener('click', logout);
    buyProBtn.addEventListener('click', buyProStub);

    authBtn.addEventListener('click', () => {
      if (currentUser) profileBtn.click();
      else authModal.classList.add('active');
    });
    closeAuthBtn.addEventListener('click', () => authModal.classList.remove('active'));
    authModal.addEventListener('click', e => { if (e.target === authModal) authModal.classList.remove('active'); });
    authLoginBtn.addEventListener('click', authLogin);
    authRegisterBtn.addEventListener('click', authRegister);
    authEmail.addEventListener('keydown', e => { if (e.key === 'Enter') authLogin(); });
    authPassword.addEventListener('keydown', e => { if (e.key === 'Enter') authLogin(); });

    adminBtn.addEventListener('click', () => {
      if (!currentUser || currentUser.uid !== ADMIN_UID) { alert('Нет прав'); return; }
      adminModal.classList.add('active');
      adminUsersPanel.style.display = 'block';
      adminGrantPanel.style.display = 'none';
      adminGiftPanel.style.display = 'none';
      loadUsersList();
    });
    closeAdminBtn.addEventListener('click', () => adminModal.classList.remove('active'));
    adminModal.addEventListener('click', e => { if (e.target === adminModal) adminModal.classList.remove('active'); });
    adminUsersTab.addEventListener('click', () => {
      adminUsersPanel.style.display = 'block';
      adminGrantPanel.style.display = 'none';
      adminGiftPanel.style.display = 'none';
      loadUsersList();
    });
    adminGrantTab.addEventListener('click', () => {
      adminUsersPanel.style.display = 'none';
      adminGrantPanel.style.display = 'block';
      adminGiftPanel.style.display = 'none';
    });
    adminGiftTab.addEventListener('click', () => {
      adminUsersPanel.style.display = 'none';
      adminGrantPanel.style.display = 'none';
      adminGiftPanel.style.display = 'block';
      loadGiftList();
    });
    refreshUsersBtn.addEventListener('click', loadUsersList);
    grantProBtn.addEventListener('click', grantPro);
    createGiftBtn.addEventListener('click', createGiftLink);

    // ===== ПРОВЕРКА ПОДАРКА В URL =====
    (function checkGiftParam() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('gift');
      if (token) {
        localStorage.setItem('gift_token', token);
        window.history.replaceState({}, document.title, window.location.pathname);
        if (currentUser) checkGiftAfterLogin();
        else alert('🎁 У вас есть подарочный сертификат! Зарегистрируйтесь или войдите, чтобы активировать PRO-план.');
      }
    })();

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    auth.onAuthStateChanged(async user => {
      currentUser = user;
      updateUI(user);
      if (user) {
        await loadUserPlan(user.uid);
        await updateProfileUI();
        await checkGiftAfterLogin();
      } else {
        userPlan = 'free';
        userExpiry = null;
        currentUser = null;
      }
    });

    loadFromStorage();
    console.log('🦕 DinoSiteX с обновлённым логотипом (зелёный градиент) готов!');
    console.log('Админ UID:', ADMIN_UID);
  </script>
</body>
</html>
